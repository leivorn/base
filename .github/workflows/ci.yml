name: ci

# 这个文件下游不需要再改了：真正的检查在 checks.yml 里，下游自己的 job 写在
# .github/workflows/project.yml（基底承诺永不创建该文件，见 scripts/check-hooks.sh）。
# 这样 ci.yml 不再是每次 sync-base 的冲突户。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read          # changes job 要读上一次 run 的结论

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 下游：调用基底发布的版本。修 CI 不再需要下游先 sync-base。
  # ci-v1 是基底里的移动标签，由 make base-release 前移；它不匹配 sync-base 的
  # refs/tags/v*，不会污染下游的标签空间。
  # 组织限制了 "Allow select actions" 导致远程调用被拒时，把下面这行换成
  # uses: ./.github/workflows/checks.yml （该文件本来就随 merge 继承了）。
  checks:
    if: github.repository != 'leivorn/base'
    uses: leivorn/base/.github/workflows/checks.yml@ci-v1

  # 基底本体：调用本提交里的 checks.yml，先在自己身上验证过，再前移 ci-v1 给下游。
  #
  # all 只在推 main 时给 true（发布前必须全量）。PR 上刻意传 false，让路径过滤那段
  # 逻辑（git diff HEAD^1 HEAD、event.before 判断）在基底自己身上先跑过一遍——
  # 否则它的首次真实执行会发生在第一个同步到新版的下游仓库上，基底这边永远测不出来。
  checks-base:
    if: github.repository == 'leivorn/base'
    uses: ./.github/workflows/checks.yml
    with:
      all: ${{ github.event_name != 'pull_request' }}

  hooks-guard:
    name: 挂载点冻结校验
    if: github.repository == 'leivorn/base'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-hooks.sh

  # 只在基底本体跑。create-base 的 scaffold_test.go 里 fixtureBase() 会把
  # **当前仓库自己的文件**（含 admin/apps/web-antd/.env）拷成一份假基底再跑
  # 一遍脚手架，其中一步要把 VITE_APP_TITLE=Admin 替换成新项目名。这个耦合
  # 是有意的——它正是用来发现"改了基底模板却忘了改脚手架"。但下游按约定必须
  # 改掉那个值（见 AGENTS.md「新项目初始化」：同域名下多个后台共用 namespace
  # 会互相覆盖登录态），于是替换匹配到 0 处，这一步在**任何下游仓库都是必然
  # 失败**，且与下游自己的代码无关。
  scaffold:
    name: 脚手架
    if: github.repository == 'leivorn/base'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/create-base/go.mod
          # 纯标准库实现，没有 go.sum；开着缓存会因为找不到 dependency path 直接失败
          cache: false
      - working-directory: tools/create-base
        run: go vet ./... && go test ./...
